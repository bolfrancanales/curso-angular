<div class="container mt-4">

  <app-formulario-producto
    (productoAgregado)="agregarProducto($event)">
  </app-formulario-producto>

  <h2>Listado de productos</h2>

  <ul class="list-group">

    <li
      class="list-group-item"
      *ngFor="let producto of productos$ | async">

      <app-item
        [nombre]="producto.nombre"
        [descripcion]="producto.descripcion">
      </app-item>

      <div class="mt-3">

        <strong>Votos: {{ producto.votos }}</strong>

        <div class="mt-2">

          <button
            type="button"
            class="btn btn-success me-2"
            appTrackingClick
            data-tracking-tag="voto-positivo"
            (click)="votarPositivo(producto.id)">
            Voto +
          </button>

          <button
          type="button"
          class="btn btn-warning me-2"
          appTrackingClick
          data-tracking-tag="voto-negativo"
          (click)="votarNegativo(producto.id)">
          Voto -
          </button>

          <button
            type="button"
            class="btn btn-danger"
            appTrackingClick
            data-tracking-tag="borrar-producto"
            (click)="borrar(producto.id)">
            Eliminar
          </button>

        </div>

      </div>

    </li>

  </ul>
  <div
  class="card mt-4 mb-4"
  *ngIf="tracking$ | async as tracking">

  <div class="card-body">

    <h3>Seguimiento de actividad</h3>

    <p>
      Voto positivo:
      {{ tracking['voto-positivo'] || 0 }}
    </p>

    <p>
      Voto negativo:
      {{ tracking['voto-negativo'] || 0 }}
    </p>

    <p>
      Eliminar producto:
      {{ tracking['eliminar-producto'] || 0 }}
    </p>

  </div>

</div>
    <app-mapa></app-mapa>
    <app-animacion-demo></app-animacion-demo>

</div>
